[package]
name = "wifi_password_tool"
version = "3.1.0"
edition = "2021"
description = "Windows WiFi password viewer (Rust edition)"

[dependencies]
qrcode = { version = "0.13", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "wifi_password_tool"
path = "src/main.rs"
